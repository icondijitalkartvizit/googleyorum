<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönlendiriliyorsunuz...</title>
  <!-- Google Fonts: Montserrat & Playfair Display -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --bg-dark: #0a0a0a;
      --card-bg: rgba(18, 18, 18, 0.88);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-dark);
      /* ARKA PLAN RESMİ LİNKİNİ BURAYA YAZABİLİRSİN */
      background-image: url('BURAYA_ARKA_PLAN_RESIM_LINKI_GELECEK'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Siyah Lüks Transparan Kaplama */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.95) 100%);
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.2);
      backdrop-filter: blur(10px);

  /* KUTUYU YUKARI ÇEKEN SATIR BURASI: */
  transform: translateY(-70px); /* Değeri büyüttükçe kutu daha da yukarı çıkar (Örn: -70px, -100px yapabilirsin) */
}

    .logo-img {
      max-width: 130px;
      max-height: 90px;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
    }
    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 12px;
      color: #dddddd;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 18px;
      font-weight: 400;
    }
    .banner-img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      margin-bottom: 18px;
    }
    .redirect-box {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.12);
    }
    .status-text {
      font-size: 13px;
      color: #e0e0e0;
      margin-bottom: 12px;
    }
    .timer-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--gold-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      font-weight: 800;
      color: #000;
      font-size: 20px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- LOGO RESMİ (Yoksa img satırını silebilirsin) -->
    <img src="BURAYA_LOGO_RESIM_LINKI_GELECEK" class="logo-img" alt="Logo" onerror="this.style.display='none'">
    
    <!-- MARKA VE SLOGAN -->
    <h1 class="brand-title">ICON DİJİTAL DÖNÜŞÜM</h1>
    <p class="subtitle">Dijital Dönüşüm & İnovasyon</p>

    <!-- REKLAM BANNER RESMİ -->
    <img src="BURAYA_BANNER_RESIM_LINKI_GELECEK" class="banner-img" alt="Reklam" onerror="this.style.display='none'">

    <div class="redirect-box">
      <p id="statusMsg" class="status-text">Özel adresinize yönlendiriliyorsunuz...</p>
      <div id="timer" class="timer-circle">3</div>
    </div>
  </div>

  <script>
    // 1. FIREBASE BİLGİLERİNİ BURAYA DOLDUR
    const firebaseConfig = {
      apiKey: "AIzaSyDrJFsP59VYp78RkPv9ViKdzk8VXScsi8w",
      authDomain: "yorumkarekod.firebaseapp.com",
      databaseURL: "https://yorumkarekod-default-rtdb.firebaseio.com",
      projectId: "yorumkarekod",
      storageBucket: "yorumkarekod.firebasestorage.app",
      messagingSenderId: "853972524347",
      appId: "1:853972524347:web:988ceb131f3dff64976b1e"
    };

    // Firebase'i Başlat
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function startRedirect() {
      const urlParams = new URLSearchParams(window.location.search);
      // Linkte ID yoksa otomatik 'qr1' seçer
      const qrId = urlParams.get('id') || 'qr1';

      database.ref('qr_links/' + qrId).once('value', (snapshot) => {
        if (snapshot.exists()) {
          const targetUrl = snapshot.val().target_url;
          let seconds = 3; // Kaç saniye reklam görünsün? (Buradan değiştirebilirsin)
          const timerEl = document.getElementById('timer');
          timerEl.innerText = seconds;

          const interval = setInterval(() => {
            seconds--;
            timerEl.innerText = seconds;
            if (seconds <= 0) {
              clearInterval(interval);
              window.location.href = targetUrl;
            }
          }, 1000);

        } else {
          showError('Geçersiz QR', `'${qrId}' koduna ait bir hedef adres bulunamadı.`);
        }
      }, (err) => {
        console.error(err);
        showError('Bağlantı Hatası', 'Veritabanına ulaşılamadı.');
      });
    }

    function showError(title, msg) {
      document.getElementById('statusMsg').innerText = msg;
      document.getElementById('statusMsg').style.color = '#ff5555';
      document.getElementById('timer').style.display = 'none';
    }

    startRedirect();
  </script>
</body>
</html>
