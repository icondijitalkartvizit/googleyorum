<body>

  <div class="container">
    <!-- LOGO RESMİ (Yoksa img satırını silebilirsin) -->
    <img src="BURAYA_LOGO_RESIM_LINKI_GELECEK" class="logo-img" alt="Logo" onerror="this.style.display='none'"
    
    <!-- MARKA VE SLOGAN -->
    <h1 class="brand-title">ICON DİJİTAL DÖNÜŞÜM</h1>
    <p class="subtitle">Dijital Dönüşüm & İnovasyon</p>

    <!-- REKLAM BANNER RESMİ -->
    <img src="BURAYA_BANNER_RESIM_LINKI_GELECEK" class="banner-img" alt="Reklam" onerror="this.style.display='none'">

    <div class="redirect-box">
      <p id="statusMsg" class="status-text">Google Yorum Sayfasına Yönlendiriliyorsunuz...</p>
      <div id="timer" class="timer-circle">3</div>
    </div>
  </div>

  <script>
    // 1. FIREBASE BİLGİLERİNİ BURAYA DOLDUR
    const firebaseConfig = {
      apiKey: "AIzaSyDrJFsP59VYp78RkPv9ViKdzk8VXScsi8w",
      authDomain: "yorumkarekod.firebaseapp.com",
      databaseURL: "https://yorumkarekod-default-rtdb.firebaseio.com",
      projectId: "yorumkarekod",
      storageBucket: "yorumkarekod.firebasestorage.app",
      messagingSenderId: "853972524347",
      appId: "1:853972524347:web:988ceb131f3dff64976b1e"
    };

    // Firebase'i Başlat
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function startRedirect() {
      const urlParams = new URLSearchParams(window.location.search);
      // Linkte ID yoksa otomatik 'qr1' seçer
      const qrId = urlParams.get('id') || 'qr1';

      database.ref('qr_links/' + qrId).once('value', (snapshot) => {
        if (snapshot.exists()) {
          const targetUrl = snapshot.val().target_url;
          let seconds = 5; // Kaç saniye reklam görünsün? (Buradan değiştirebilirsin)
          const timerEl = document.getElementById('timer');
          timerEl.innerText = seconds;

          const interval = setInterval(() => {
            seconds--;
            timerEl.innerText = seconds;
            if (seconds <= 0) {
              clearInterval(interval);
              window.location.href = targetUrl;
            }
          }, 1000);

        } else {
          showError('Geçersiz QR', `'${qrId}' koduna ait bir hedef adres bulunamadı.`);
        }
      }, (err) => {
        console.error(err);
        showError('Bağlantı Hatası', 'Veritabanına ulaşılamadı.');
      });
    }

    function showError(title, msg) {
      document.getElementById('statusMsg').innerText = msg;
      document.getElementById('statusMsg').style.color = '#ff5555';
      document.getElementById('timer').style.display = 'none';
    }

    startRedirect();
  </script>
<!-- EKRANIN EN ALTINA SABİTLENMİŞ GOLD NUMARA -->

  <!-- GOLD KOPYALA BUTONU -->
  <button type="button" class="copy-btn" id="copyBtn">
    <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
    <span id="copyBtnText">Kopyala</span>
  </button>
</div>

<!-- KOPYALAMA SCRIPT (HER CİHAZDA %100 ÇALIŞAN YÖNTEM) -->
<script>
  document.getElementById('copyBtn').addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    
    // Numarayı doğrudan HTML'deki yazıdan çeker
    const phoneNum = document.getElementById('targetPhone').innerText.trim();
    
    // Panoya Kopyalama İşlemi
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(phoneNum).then(showSuccess);
    } else {
      // Eski veya Mobil Tarayıcılar İçin Yedek Yöntem
      const textArea = document.createElement("textarea");
      textArea.value = phoneNum;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showSuccess();
      } catch (err) {
        console.error('Kopyalanamadı', err);
      }
      document.body.removeChild(textArea);
    }

    function showSuccess() {
      const btnText = document.getElementById("copyBtnText");
      btnText.innerText = "Kopyalandı!";
      setTimeout(() => {
        btnText.innerText = "ŞİMDİ KOPYALA!";
      }, 2000);
    }
  });
</script>
