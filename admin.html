<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marka & Reklam Yönetim Paneli</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0f0f12;
      color: #fff;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h2 {
      color: #d4af37;
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid #d4af37;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #ccc;
    }
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1e;
      color: #fff;
      box-sizing: border-box;
    }
    input[type="file"] {
      background: #1a1a1e;
      color: #ccc;
      padding: 8px;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #bf953f, #aa771c);
      color: #000;
      font-weight: 700;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
    }
    .preview-img {
      max-height: 80px;
      margin-top: 8px;
      border-radius: 6px;
      display: block;
    }
    .section-title {
      font-size: 15px;
      color: #d4af37;
      margin-top: 25px;
      margin-bottom: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <h2>Marka Yönetim Paneli</h2>

  <form id="adminForm">
    <div class="section-title">1. Marka & Görsel Ayarları</div>
    
    <div class="form-group">
      <label>Marka Başlığı</label>
      <input type="text" id="title" value="FEAT PREMIUM">
    </div>

    <div class="form-group">
      <label>Alt Slogan / Açıklama</label>
      <input type="text" id="subtitle" value="Dijital Dönüşüm & İnovasyon">
    </div>

    <div class="form-group">
      <label>Yönlendirme Gecikmesi (Saniye)</label>
      <input type="number" id="delay" value="3" min="1" max="10">
    </div>

    <div class="form-group">
      <label>Logo Seç (PNG / JPG)</label>
      <input type="file" id="logoFile" accept="image/*">
      <img id="logoPrev" class="preview-img">
    </div>

    <div class="form-group">
      <label>Reklam Banner Görseli Seç</label>
      <input type="file" id="bannerFile" accept="image/*">
      <img id="bannerPrev" class="preview-img">
    </div>

    <div class="form-group">
      <label>Arka Plan Resmi Seç</label>
      <input type="file" id="bgFile" accept="image/*">
      <img id="bgPrev" class="preview-img">
    </div>

    <div class="section-title">2. Firebase Bağlantı Bilgileri</div>

    <div class="form-group"><label>API Key</label><input type="text" id="apiKey"></div>
    <div class="form-group"><label>Auth Domain</label><input type="text" id="authDomain"></div>
    <div class="form-group"><label>Database URL</label><input type="text" id="databaseURL"></div>
    <div class="form-group"><label>Project ID</label><input type="text" id="projectId"></div>

    <button type="button" class="btn" onclick="saveSettings()">AYARLARI KAYDET</button>
  </form>

  <script>
    // Varolan Ayarları Yükle
    const saved = JSON.parse(localStorage.getItem('myBrandConfig')) || {};
    if(saved.title) document.getElementById('title').value = saved.title;
    if(saved.subtitle) document.getElementById('subtitle').value = saved.subtitle;
    if(saved.delay) document.getElementById('delay').value = saved.delay;
    if(saved.apiKey) document.getElementById('apiKey').value = saved.apiKey;
    if(saved.authDomain) document.getElementById('authDomain').value = saved.authDomain;
    if(saved.databaseURL) document.getElementById('databaseURL').value = saved.databaseURL;
    if(saved.projectId) document.getElementById('projectId').value = saved.projectId;

    if(saved.logo) document.getElementById('logoPrev').src = saved.logo;
    if(saved.banner) document.getElementById('bannerPrev').src = saved.banner;
    if(saved.bg) document.getElementById('bgPrev').src = saved.bg;

    // Görsel Okuyucu
    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function saveSettings() {
      const config = {
        title: document.getElementById('title').value,
        subtitle: document.getElementById('subtitle').value,
        delay: document.getElementById('delay').value,
        apiKey: document.getElementById('apiKey').value,
        authDomain: document.getElementById('authDomain').value,
        databaseURL: document.getElementById('databaseURL').value,
        projectId: document.getElementById('projectId').value,
        storageBucket: document.getElementById('projectId').value + ".appspot.com",
        logo: saved.logo || "",
        banner: saved.banner || "",
        bg: saved.bg || ""
      };

      const logoFile = document.getElementById('logoFile').files[0];
      const bannerFile = document.getElementById('bannerFile').files[0];
      const bgFile = document.getElementById('bgFile').files[0];

      if(logoFile) config.logo = await getBase64(logoFile);
      if(bannerFile) config.banner = await getBase64(bannerFile);
      if(bgFile) config.bg = await getBase64(bgFile);

      localStorage.setItem('myBrandConfig', JSON.stringify(config));
      alert('Tüm Ayarlar ve Görseller Başarıyla Kaydedildi!');
      location.reload();
    }
  </script>
</body>
  </html>
